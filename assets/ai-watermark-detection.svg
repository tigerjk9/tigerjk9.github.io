<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="470" rx="18" fill="#f6f4ee"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#20242e">키를 쥔 쪽은 다시 색칠해 '초록'을 센다</text>
  <text x="40" y="76" font-size="15.5" fill="#5b6472">탐지기는 글의 뜻이나 문체를 보지 않는다. 같은 규칙으로 색을 칠하고 초록의 개수만 센다.</text>

  <!-- chips -->
  <g font-size="13.5">
    <g fill="#2f9e44"><rect x="40" y="100" width="70" height="30" rx="6"/><rect x="190" y="100" width="58" height="30" rx="6"/><rect x="330" y="100" width="66" height="30" rx="6"/><rect x="470" y="100" width="54" height="30" rx="6"/><rect x="600" y="100" width="72" height="30" rx="6"/><rect x="760" y="100" width="60" height="30" rx="6"/></g>
    <g fill="none" stroke="#c0392b" stroke-dasharray="4 3"><rect x="118" y="100" width="64" height="30" rx="6"/><rect x="256" y="100" width="66" height="30" rx="6"/><rect x="404" y="100" width="58" height="30" rx="6"/><rect x="532" y="100" width="60" height="30" rx="6"/><rect x="680" y="100" width="72" height="30" rx="6"/><rect x="828" y="100" width="62" height="30" rx="6"/></g>
  </g>
  <text x="40" y="152" font-size="13" fill="#8a93a0">■ 채워진 초록 = 키가 초록으로 칠한 단어 · ▢ 점선 빨강 = 빨강. 글자는 어느 쪽이든 똑같이 읽힌다.</text>

  <!-- meter no-watermark -->
  <text x="40" y="212" font-size="16" font-weight="700" fill="#3a4250">워터마크 없음</text>
  <rect x="40" y="226" width="600" height="26" rx="6" fill="#e7e2d7"/>
  <rect x="40" y="226" width="300" height="26" rx="6" fill="#b7bec8"/>
  <line x1="340" y1="218" x2="340" y2="260" stroke="#8a93a0" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="655" y="245" font-size="14.5" fill="#5b6472">초록 ≈ 50% · 동전 던지기</text>

  <!-- meter watermark -->
  <text x="40" y="298" font-size="16" font-weight="700" fill="#3a4250">워터마크 있음</text>
  <rect x="40" y="312" width="600" height="26" rx="6" fill="#e7e2d7"/>
  <rect x="40" y="312" width="342" height="26" rx="6" fill="#2f9e44"/>
  <line x1="340" y1="304" x2="340" y2="346" stroke="#8a93a0" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="655" y="331" font-size="14.5" fill="#2f9e44">초록이 우연보다 꾸준히 많다</text>

  <rect x="40" y="374" width="880" height="72" rx="12" fill="#fbf6ea" stroke="#ecdcb8"/>
  <text x="60" y="404" font-size="14.5" fill="#6a5a2a">짧은 글에선 이 치우침이 옅어 판별이 어렵다. 글이 길수록 증거가 쌓여 설득력이 커진다.</text>
  <text x="60" y="430" font-size="14.5" fill="#6a5a2a">증거의 세기 ≈ 살아남은 표식 비율 × √글길이 — 그래서 '길이'가 관건이다.</text>
</svg>
