<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="500" rx="18" fill="#f6f4ee"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#20242e">비밀 키가 단어 선택에 '초록 쪽으로' 살짝 힘을 준다</text>
  <text x="40" y="76" font-size="15.5" fill="#5b6472">문장: “연구 결과는 꽤 <tspan font-weight="700" fill="#20242e">▮</tspan>” — 다음 한 단어를 고르는 순간</text>

  <!-- Left panel: model's own odds -->
  <rect x="40" y="100" width="420" height="300" rx="12" fill="#ffffff" stroke="#e3ded3"/>
  <text x="60" y="130" font-size="16" font-weight="700" fill="#3a4250">키 없음 — 모델 본래 확률</text>
  <!-- bars -->
  <g font-size="14" fill="#3a4250">
    <text x="60" y="168">인상적이었다</text><rect x="185" y="156" width="235" height="16" rx="4" fill="#c7cdd6"/><text x="428" y="168" text-anchor="end" fill="#8a93a0">38%</text>
    <text x="60" y="204">놀라웠다</text><rect x="185" y="192" width="150" height="16" rx="4" fill="#c7cdd6"/><text x="428" y="204" text-anchor="end" fill="#8a93a0">24%</text>
    <text x="60" y="240">좋았다</text><rect x="185" y="228" width="112" height="16" rx="4" fill="#c7cdd6"/><text x="428" y="240" text-anchor="end" fill="#8a93a0">18%</text>
    <text x="60" y="276">흥미로웠다</text><rect x="185" y="264" width="74" height="16" rx="4" fill="#c7cdd6"/><text x="428" y="276" text-anchor="end" fill="#8a93a0">12%</text>
    <text x="60" y="312">뛰어났다</text><rect x="185" y="300" width="50" height="16" rx="4" fill="#c7cdd6"/><text x="428" y="312" text-anchor="end" fill="#8a93a0">8%</text>
  </g>
  <text x="60" y="360" font-size="13.5" fill="#6b7482">어느 단어를 골라도 문장은 자연스럽다.</text>
  <text x="60" y="382" font-size="13.5" fill="#6b7482">이 '여유'가 표식이 숨을 빈자리다.</text>

  <!-- arrow -->
  <text x="490" y="258" font-size="30" fill="#e8631f">→</text>

  <!-- Right panel: keyed green/red nudge -->
  <rect x="500" y="100" width="420" height="300" rx="12" fill="#ffffff" stroke="#e3ded3"/>
  <text x="520" y="130" font-size="16" font-weight="700" fill="#3a4250">키 적용 — <tspan fill="#2f9e44">초록</tspan>에 살짝 힘</text>
  <g font-size="14">
    <text x="520" y="168" fill="#2f9e44">인상적이었다</text><rect x="645" y="156" width="255" height="16" rx="4" fill="#2f9e44"/>
    <text x="520" y="204" fill="#c0392b">놀라웠다</text><rect x="645" y="192" width="120" height="16" rx="4" fill="#e6a6a0"/>
    <text x="520" y="240" fill="#2f9e44">좋았다</text><rect x="645" y="228" width="140" height="16" rx="4" fill="#2f9e44"/>
    <text x="520" y="276" fill="#c0392b">흥미로웠다</text><rect x="645" y="264" width="58" height="16" rx="4" fill="#e6a6a0"/>
    <text x="520" y="312" fill="#2f9e44">뛰어났다</text><rect x="645" y="300" width="70" height="16" rx="4" fill="#2f9e44"/>
  </g>
  <text x="520" y="360" font-size="13.5" fill="#6b7482">빨강이 이길 수도 있다. 다만 조금 덜 나올 뿐.</text>
  <text x="520" y="382" font-size="13.5" fill="#6b7482">사람은 못 느끼고, 긴 글에선 초록이 쌓인다.</text>

  <text x="40" y="440" font-size="14.5" fill="#4a5260">색은 단어의 고정된 성질이 아니다. 키는 <tspan font-weight="700">바로 앞 몇 단어</tspan>를 보고 색을 정한다.</text>
  <text x="40" y="466" font-size="14.5" fill="#4a5260">그래서 같은 단어도 자리에 따라 초록이 됐다가 빨강이 된다 — 키를 쥔 쪽만 그 배열을 안다.</text>
</svg>
