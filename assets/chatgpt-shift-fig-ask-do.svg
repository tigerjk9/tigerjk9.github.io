<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" width="920" height="430" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif"><rect x="0" y="0" width="920" height="430" rx="18" fill="#faf8f3"/><rect x="1" y="1" width="918" height="428" rx="17" fill="none" stroke="#e5e0d6" stroke-width="2"/><text x="40" y="52" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" font-size="30" font-weight="800" fill="#1f2733">묻는 도구에서 시키는 도구로</text><text x="40" y="82" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" font-size="17" fill="#5b6672">챗GPT 대화 150만 건 표본 · 업무 30% / 업무 밖 70%</text><rect x="40" y="128" width="252" height="74" rx="10" fill="#2f6f9f"/><rect x="292" y="128" width="588" height="74" rx="10" fill="#cfe0ec"/><rect x="286" y="128" width="12" height="74" fill="#faf8f3"/><text x="166" y="174" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">30%</text><text x="586" y="174" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2733">70%</text><text x="40" y="114" font-size="18" font-weight="700" fill="#2f6f9f">업무 중 사용</text><text x="880" y="114" text-anchor="end" font-size="18" font-weight="700" fill="#5b6672">업무 밖 사용</text><rect x="40" y="258" width="840" height="128" rx="12" fill="#ffffff" stroke="#e5e0d6"/><text x="64" y="302" font-size="20" font-weight="800" fill="#1f2733">일터에서는 &#39;시키기&#39;가 &#39;묻기&#39;를 앞선다</text><text x="64" y="338" font-size="17" fill="#5b6672">글쓰기·코딩·분석처럼 결과물을 만드는 &#39;실행&#39; 사용이</text><text x="64" y="362" font-size="17" fill="#5b6672">업무 밖보다 <tspan fill="#d98a2b" font-weight="800" font-size="19">2배 이상</tspan> 잦다. 업무 밖에서는 여전히 &#39;질문&#39;이 가장 큰 몫.</text></svg>