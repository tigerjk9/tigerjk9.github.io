<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="470" rx="18" fill="#f6f4ee"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#20242e">편집은 '원문 그대로 이어진 구간'에서만 표식을 지운다</text>
  <text x="40" y="76" font-size="15.5" fill="#5b6472">표식은 직전 몇 단어의 배열에서 나온다. 그 배열이 살아 있는 자리에서만 증거가 된다.</text>

  <!-- rows -->
  <g font-size="14.5">
    <!-- row1 -->
    <text x="40" y="128" fill="#3a4250">원문 그대로</text>
    <g><rect x="230" y="114" width="470" height="20" rx="4" fill="#2f9e44"/></g>
    <text x="716" y="128" fill="#2f9e44">탐지 거의 확실</text>
    <!-- row2 -->
    <text x="40" y="180" fill="#3a4250">오타만 수정</text>
    <g fill="#2f9e44"><rect x="230" y="166" width="150" height="20" rx="4"/><rect x="392" y="166" width="130" height="20" rx="4"/><rect x="534" y="166" width="120" height="20" rx="4"/></g>
    <rect x="384" y="166" width="6" height="20" fill="#d9d3c6"/><rect x="526" y="166" width="6" height="20" fill="#d9d3c6"/><rect x="656" y="166" width="44" height="20" rx="4" fill="#e7e2d7"/>
    <text x="716" y="180" fill="#2f9e44">여전히 확실</text>
    <!-- row3 -->
    <text x="40" y="232" fill="#3a4250">한 번 의역</text>
    <g fill="#2f9e44"><rect x="230" y="218" width="70" height="20" rx="4"/><rect x="330" y="218" width="46" height="20" rx="4"/><rect x="430" y="218" width="60" height="20" rx="4"/><rect x="560" y="218" width="40" height="20" rx="4"/></g>
    <rect x="230" y="218" width="470" height="20" rx="4" fill="#d9d3c6" opacity="0.28"/>
    <text x="716" y="232" fill="#c78a1e">옅어짐(길면 재부상)</text>
    <!-- row4 -->
    <text x="40" y="284" fill="#3a4250">전면 재작성</text>
    <rect x="230" y="270" width="470" height="20" rx="4" fill="#e7e2d7"/>
    <rect x="250" y="270" width="5" height="20" fill="#2f9e44"/><rect x="470" y="270" width="5" height="20" fill="#2f9e44"/>
    <text x="716" y="284" fill="#c0392b">동전 던지기(~0.5%)</text>
  </g>
  <text x="230" y="316" font-size="12.5" fill="#8a93a0">■ 초록 = 원문 배열이 그대로 살아남은 구간(여기서만 표식이 잡힘) · ▢ 회색 = 새로 쓴 부분</text>

  <rect x="40" y="352" width="880" height="86" rx="12" fill="#fbf6ea" stroke="#ecdcb8"/>
  <text x="60" y="384" font-size="14.5" fill="#6a5a2a">가벼운 손질이나 한 번의 의역은 표식을 '희석'할 뿐이다. 글이 길면 남은 조각만으로 다시 드러난다</text>
  <text x="60" y="408" font-size="14.5" fill="#6a5a2a">(사람이 의역해도 약 800토큰이 넘으면 재탐지된다). 표식을 실제로 지우는 길은 하나다 —</text>
  <text x="60" y="432" font-size="14.5" fill="#6a5a2a">원문과 단어 배열을 공유하지 않도록 <tspan font-weight="700" fill="#4a3a10">의미부터 다시 쓰는 전면 재구성</tspan>이다.</text>
</svg>
