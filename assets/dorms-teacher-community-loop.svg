<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" role="img" width="920" height="462" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif"><rect x="0" y="0" width="920" height="462" rx="18" fill="#faf8f3"/><rect x="1" y="1" width="918" height="460" rx="17" fill="none" stroke="#e5e0d6" stroke-width="2"/><text x="40" y="52" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" font-size="30" font-weight="800" fill="#1f2733">도름(DoRms)이 도는 방식</text><text x="40" y="82" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" font-size="17" fill="#5b6672">묻는 커뮤니티가 아니라, 만들어 나누는 커뮤니티</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b6672"/></marker></defs><rect x="61" y="150" width="180" height="150" rx="14" fill="#ffffff" stroke="#e5e0d6"/><rect x="61" y="150" width="180" height="6" rx="3" fill="#2f6f9f"/><circle cx="91" cy="194" r="16" fill="#2f6f9f"/><text x="91" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text><text x="117" y="200" font-size="18" font-weight="800" fill="#1f2733">현장의 문제</text><text x="81" y="236" font-size="14" fill="#5b6672">교실·업무에서</text><text x="81" y="258" font-size="14" fill="#5b6672">막히는 지점</text><path d="M 245 225 L 263 225" stroke="#5b6672" stroke-width="2.5" marker-end="url(#ah)"/><rect x="267" y="150" width="180" height="150" rx="14" fill="#ffffff" stroke="#e5e0d6"/><rect x="267" y="150" width="180" height="6" rx="3" fill="#d98a2b"/><circle cx="297" cy="194" r="16" fill="#d98a2b"/><text x="297" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text><text x="323" y="200" font-size="18" font-weight="800" fill="#1f2733">직접 만든다</text><text x="287" y="236" font-size="14" fill="#5b6672">바이브코딩으로</text><text x="287" y="258" font-size="14" fill="#5b6672">앱·자료 제작</text><path d="M 451 225 L 469 225" stroke="#5b6672" stroke-width="2.5" marker-end="url(#ah)"/><rect x="473" y="150" width="180" height="150" rx="14" fill="#ffffff" stroke="#e5e0d6"/><rect x="473" y="150" width="180" height="6" rx="3" fill="#3f8f6b"/><circle cx="503" cy="194" r="16" fill="#3f8f6b"/><text x="503" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text><text x="529" y="200" font-size="18" font-weight="800" fill="#1f2733">커뮤니티 공유</text><text x="493" y="236" font-size="14" fill="#5b6672">동료 교사에게</text><text x="493" y="258" font-size="14" fill="#5b6672">공개·설명</text><path d="M 657 225 L 675 225" stroke="#5b6672" stroke-width="2.5" marker-end="url(#ah)"/><rect x="679" y="150" width="180" height="150" rx="14" fill="#ffffff" stroke="#e5e0d6"/><rect x="679" y="150" width="180" height="6" rx="3" fill="#8a5cc0"/><circle cx="709" cy="194" r="16" fill="#8a5cc0"/><text x="709" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text><text x="735" y="200" font-size="18" font-weight="800" fill="#1f2733">&#39;도름&#39; 평판</text><text x="699" y="236" font-size="14" fill="#5b6672">받은 도름으로</text><text x="699" y="258" font-size="14" fill="#5b6672">신뢰가 쌓인다</text><path d="M 769 306 C 769 344, 151 344, 151 306" stroke="#5b6672" stroke-width="2.5" fill="none" stroke-dasharray="6 6" marker-end="url(#ah)"/><text x="460" y="392" text-anchor="middle" font-size="14" fill="#5b6672">다른 교사가 받아 각자의 교실에 맞게 다시 고친다</text></svg>