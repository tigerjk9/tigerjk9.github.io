<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" width="920" height="470" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif"><rect x="0" y="0" width="920" height="470" rx="18" fill="#faf8f3"/><rect x="1" y="1" width="918" height="468" rx="17" fill="none" stroke="#e5e0d6" stroke-width="2"/><text x="40" y="52" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" font-size="30" font-weight="800" fill="#1f2733">도구가 평범해지는 세 가지 신호</text><text x="40" y="82" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" font-size="17" fill="#5b6672">얼리어답터의 장난감에서 보통의 연장으로 — 확산 곡선의 변곡점</text><rect x="40" y="110" width="280" height="330" rx="12" fill="#ffffff" stroke="#e5e0d6"/><rect x="40" y="110" width="280" height="6" rx="3" fill="#3f8f6b"/><text x="60" y="150" font-size="19" font-weight="800" fill="#1f2733">지리적 확산</text><text x="60" y="178" font-size="13.5" fill="#5b6672">라틴아메리카·아프리카·</text><text x="60" y="197" font-size="13.5" fill="#5b6672">오세아니아가 가장 빠르게 증가</text><text x="60" y="226" font-size="13.5" font-weight="600" fill="#1f2733">페루</text><rect x="60" y="234" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="60" y="234" width="238" height="16" rx="8" fill="#3f8f6b"/><text x="60" y="278" font-size="13.5" font-weight="600" fill="#1f2733">우루과이</text><rect x="60" y="286" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="60" y="286" width="218" height="16" rx="8" fill="#3f8f6b"/><text x="60" y="330" font-size="13.5" font-weight="600" fill="#1f2733">코스타리카</text><rect x="60" y="338" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="60" y="338" width="199" height="16" rx="8" fill="#3f8f6b"/><line x1="60" y1="405" x2="300" y2="405" stroke="#e5e0d6"/><text x="60" y="426" font-size="12" fill="#5b6672">1인당 순위 급상승 상위국</text><rect x="340" y="110" width="280" height="330" rx="12" fill="#ffffff" stroke="#e5e0d6"/><rect x="340" y="110" width="280" height="6" rx="3" fill="#d98a2b"/><text x="360" y="150" font-size="19" font-weight="800" fill="#1f2733">텍스트에서 제작으로</text><text x="360" y="178" font-size="13.5" fill="#5b6672">멀티미디어가 가장 빠르게</text><text x="360" y="197" font-size="13.5" fill="#5b6672">크는 사용처</text><text x="360" y="226" font-size="13.5" font-weight="600" fill="#1f2733">전 세계 7.8%</text><rect x="360" y="234" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="360" y="234" width="185" height="16" rx="8" fill="#d98a2b"/><text x="360" y="278" font-size="13.5" font-weight="600" fill="#1f2733">브라질 10%+</text><rect x="360" y="286" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="360" y="286" width="238" height="16" rx="8" fill="#d98a2b"/><text x="360" y="330" font-size="13.5" font-weight="600" fill="#1f2733">콜롬비아 10%+</text><rect x="360" y="338" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="360" y="338" width="238" height="16" rx="8" fill="#d98a2b"/><line x1="360" y1="405" x2="600" y2="405" stroke="#e5e0d6"/><text x="360" y="426" font-size="12" fill="#5b6672">전체 메시지 중 멀티미디어 비중</text><rect x="640" y="110" width="280" height="330" rx="12" fill="#ffffff" stroke="#e5e0d6"/><rect x="640" y="110" width="280" height="6" rx="3" fill="#2f6f9f"/><text x="660" y="150" font-size="19" font-weight="800" fill="#1f2733">연령 확대</text><text x="660" y="178" font-size="13.5" fill="#5b6672">35세 이상 메시지 비중이</text><text x="660" y="197" font-size="13.5" fill="#5b6672">오르는 중</text><text x="660" y="226" font-size="13.5" font-weight="600" fill="#1f2733">전 세계 +5%p</text><rect x="660" y="234" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="660" y="234" width="119" height="16" rx="8" fill="#2f6f9f"/><text x="660" y="278" font-size="13.5" font-weight="600" fill="#1f2733">프랑스 +10%p</text><rect x="660" y="286" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="660" y="286" width="238" height="16" rx="8" fill="#2f6f9f"/><text x="660" y="330" font-size="13.5" font-weight="600" fill="#1f2733">체코 +10%p</text><rect x="660" y="338" width="238" height="16" rx="8" fill="#eef0f2"/><rect x="660" y="338" width="238" height="16" rx="8" fill="#2f6f9f"/><line x1="660" y1="405" x2="900" y2="405" stroke="#e5e0d6"/><text x="660" y="426" font-size="12" fill="#5b6672">1년 전 대비 35세+ 비중 변화</text></svg>