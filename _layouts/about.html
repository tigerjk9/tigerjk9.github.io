---
layout: default
---
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
#about-app{
  --acc:#58a6ff; --amber:#e6b84a;
  --text:#e6edf3; --body:#c2ccd6; --muted:#7d8590;
  --line:rgba(240,246,252,.1); --hair:rgba(240,246,252,.08);
  --nodebg:rgba(20,27,38,.72); --nodebd:rgba(88,166,255,.3);
  --card:rgba(255,255,255,.045); --cardbd:rgba(255,255,255,.11);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  color:var(--body); word-break:keep-all;
  overflow-x:hidden; overflow-x:clip; /* clip: 스크롤 컨테이너化 방지(이중 스크롤바) */
}
html[data-theme="light"] #about-app{
  --acc:#0969da; --amber:#a8781a;
  --text:#1f2328; --body:#3d454e; --muted:#6b7280;
  --line:rgba(31,35,40,.12); --hair:rgba(31,35,40,.09);
  --nodebg:rgba(255,255,255,.82); --nodebd:rgba(9,105,218,.26);
  --card:#fff; --cardbd:#e7e2d6;
}
#about-app .ab-wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* ---------- 스크롤 리빌 (JS가 .rv 부여, no-JS면 항상 보임) ---------- */
#about-app .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
#about-app .rv.in{opacity:1;transform:none}

/* ---------- 그래프 히어로 ---------- */
#about-app .ab-hero{position:relative;max-width:1440px;margin:0 auto;padding:40px 24px 8px}
#about-app .ab-links{display:none}
#about-app .ab-eyebrow{display:flex;align-items:center;gap:2px;font-size:.8rem;font-weight:600;
  letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:0 0 16px}
#about-app .ab-eyebrow i{font-style:normal;color:var(--amber);margin:0 .5em}
#about-app .ab-head h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.16;font-weight:900;
  letter-spacing:-.04em;color:var(--text);margin:0}
#about-app .ab-head h1 em{font-style:normal;color:var(--acc)}
#about-app .ab-intro{margin:18px 0 0;font-size:1.02rem;line-height:1.85;max-width:440px}
#about-app .ab-intro b{color:var(--text);font-weight:600}
#about-app .ab-chips{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:7px;margin:26px auto 0;max-width:600px}
#about-app .ab-chips span{padding:.32em .85em;border:1px solid var(--line);border-radius:999px;
  font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.01em;
  transition:color .2s,border-color .2s}
#about-app .ab-chips span:hover{color:var(--body);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
#about-app .ab-chips span.hot{border-color:color-mix(in srgb,var(--acc) 38%,transparent);color:var(--acc)}
#about-app .ab-chips .lb{border:none;padding:0;margin-right:.5em;font-size:.74rem;font-weight:600;
  letter-spacing:.12em;color:var(--muted)}
#about-app .ab-chips .lb::before{content:"◦ ";color:var(--amber)}

#about-app .ab-me{margin:34px auto 0;text-align:center;width:240px}
#about-app .ab-ring{position:relative;display:block;width:240px;height:240px;margin:0 auto}
#about-app .ab-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;
  border:1.5px dashed var(--amber);opacity:.42;animation:ab-orbit 90s linear infinite}
#about-app .ab-ring::after{content:"";position:absolute;inset:2px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--acc) 13%,transparent)}
@keyframes ab-orbit{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){#about-app .ab-ring::before{animation:none}}
#about-app .ab-ring canvas,#about-app .ab-ring img{position:relative;display:block;width:240px;height:240px}
#about-app .ab-ring img{object-fit:cover;border-radius:50%}
#about-app .ab-me figcaption{margin-top:10px;font-size:.85rem;color:var(--muted)}
#about-app .ab-me figcaption b{display:block;color:var(--text);font-weight:700;font-size:1rem}

#about-app .ab-nodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
  margin:26px auto 0;max-width:560px}
#about-app .ab-node{display:block;background:var(--nodebg);border:1px solid var(--nodebd);
  border-radius:16px;padding:.6em 1.1em;text-align:center;text-decoration:none;
  box-shadow:0 8px 26px rgba(2,8,20,.26);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .2s,transform .2s,box-shadow .2s}
#about-app .ab-node:hover{border-color:var(--amber);transform:translateY(-2px);
  box-shadow:0 12px 32px color-mix(in srgb,var(--acc) 20%,transparent)}
#about-app .ab-node .t{display:block;font-size:.93rem;font-weight:700;color:var(--text);letter-spacing:-.01em}
#about-app .ab-node .t em{font-style:normal;font-size:.82em;font-weight:700;color:var(--acc);margin-left:.4em}
#about-app .ab-node .s{display:block;font-size:.73rem;color:var(--muted);margin-top:2px}

/* 스택 모드: 초상에서 노드로 이어지는 연결 줄기 + 가지 (모바일·태블릿 그래프 표현) */
#about-app .ab-hero:not(.gm) .ab-nodes{position:relative;margin-top:36px}
#about-app .ab-hero:not(.gm) .ab-nodes::before{content:"";position:absolute;left:50%;top:-32px;bottom:16px;
  width:1.6px;transform:translateX(-50%);
  background:linear-gradient(color-mix(in srgb,var(--acc) 55%,transparent),color-mix(in srgb,var(--acc) 8%,transparent))}
#about-app .ab-hero:not(.gm) .ab-nodes::after{content:"";position:absolute;left:50%;top:-38px;
  width:6px;height:6px;border-radius:50%;background:var(--amber);transform:translateX(-50%)}
#about-app .ab-hero:not(.gm) .ab-node{position:relative}
#about-app .ab-hero:not(.gm) .ab-node::before{content:"";position:absolute;top:50%;width:5px;height:1.4px;
  background:color-mix(in srgb,var(--acc) 32%,transparent)}
#about-app .ab-hero:not(.gm) .ab-node:nth-child(odd)::before{right:-5px}
#about-app .ab-hero:not(.gm) .ab-node:nth-child(even)::before{left:-5px}

/* 스택 모드 넓은 화면: 헤드 중앙 정렬 (그래프 모드 미만 태블릿·데스크톱) */
@media (min-width:700px){
  #about-app .ab-hero:not(.gm) .ab-head{max-width:640px;margin:0 auto;text-align:center}
  #about-app .ab-hero:not(.gm) .ab-eyebrow{justify-content:center}
  #about-app .ab-hero:not(.gm) .ab-intro{margin-left:auto;margin-right:auto;max-width:560px}
  #about-app .ab-hero:not(.gm) .ab-chips{justify-content:center;max-width:640px;margin-left:auto;margin-right:auto}
}

/* 그래프 모드 (JS가 1260px 이상에서 .gm 부여) */
#about-app .ab-hero.gm{height:700px;padding:0;overflow:hidden}
#about-app .gm .ab-links{display:block;position:absolute;inset:0;width:100%;height:100%}
#about-app .gm .ab-head{position:absolute;left:56px;top:64px;z-index:3;max-width:460px}
#about-app .gm .ab-head h1{font-size:4.1rem}
#about-app .gm .ab-me{position:absolute;z-index:2;margin:0;transform:translate(-50%,-50%)}
#about-app .gm .ab-nodes{display:contents}
#about-app .gm .ab-node{position:absolute;z-index:2;white-space:nowrap;border-radius:999px;
  transform:translate(-50%,-50%)}
#about-app .gm .ab-node:hover{transform:translate(-50%,-52%)}
#about-app .gm .ab-chips{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  margin:0;max-width:none;width:max-content;z-index:3}

/* ---------- 숫자 밴드 ---------- */
#about-app .ab-stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-top:34px}
#about-app .ab-stats .in{display:grid;grid-template-columns:repeat(4,1fr)}
#about-app .ab-stats .st{padding:34px 8px 30px;text-align:center;position:relative}
#about-app .ab-stats .st+.st::before{content:"";position:absolute;left:0;top:30%;height:40%;width:1px;background:var(--line)}
#about-app .ab-stats .n{margin:0;font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:900;letter-spacing:-.03em;color:var(--text)}
#about-app .ab-stats .n em{font-style:normal;color:var(--acc);font-size:.6em;font-weight:700;margin-left:2px}
#about-app .ab-stats .l{margin:7px 0 0;font-size:.85rem;color:var(--muted)}
@media (max-width:700px){
  #about-app .ab-stats .in{grid-template-columns:repeat(2,1fr)}
  #about-app .ab-stats .st:nth-child(3)::before{display:none}
}

/* ---------- 공통 섹션 ---------- */
#about-app .ab-sec{padding:58px 0 6px}
#about-app .ab-sec h2{font-size:1.7rem;font-weight:900;letter-spacing:-.03em;color:var(--text);
  margin:0 0 .5em;padding-bottom:.45em;border-bottom:1px solid var(--line)}
#about-app .ab-sec h2::before{content:"";display:inline-block;width:.5rem;height:1rem;vertical-align:-1px;
  background:linear-gradient(var(--acc),var(--amber));border-radius:3px;margin-right:.55rem}
#about-app .ab-sub{margin:-.2em 0 1.6em;font-size:.9rem;color:var(--muted)}
#about-app .ab-sec a{color:var(--acc);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
#about-app .ab-sec a:hover{border-bottom-color:var(--acc)}
#about-app .ab-sec > ul,#about-app .ab-sec section > ul{list-style:none;padding-left:0}
#about-app .ab-sec > ul li,#about-app .ab-sec section > ul li{position:relative;padding:.3rem 0 .3rem 1.1rem;line-height:1.65}
#about-app .ab-sec > ul li::before,#about-app .ab-sec section > ul li::before{content:"";position:absolute;left:.12rem;top:.75em;
  width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* ---------- 지금 (현직) ---------- */
#about-app .ab-now{border:1px solid var(--cardbd);border-left:4px solid var(--acc);background:var(--card);
  border-radius:14px;padding:1.05rem 1.4rem;margin:0 0 2.2rem}
#about-app .ab-now ul{list-style:none;padding:0;margin:0}
#about-app .ab-now li{position:relative;padding:.28rem 0 .28rem 1.1rem;line-height:1.65}
#about-app .ab-now li::before{content:"";position:absolute;left:.1rem;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--acc)}

/* ---------- 타임라인 ---------- */
#about-app .ab-tl{position:relative;padding-left:34px}
#about-app .ab-tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 22%,transparent))}
#about-app .ab-era{position:relative;padding:0 0 40px 22px}
#about-app .ab-era::before{content:"";position:absolute;left:-32px;top:4px;width:13px;height:13px;border-radius:50%;
  background:var(--amber);border:3px solid var(--card);box-shadow:0 0 0 2px var(--amber)}
#about-app .ab-era .yr{margin:0;font-size:.84rem;font-weight:700;letter-spacing:.14em;color:var(--acc)}
#about-app .ab-era h3{margin:.35em 0 .65em;font-size:1.24rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
#about-app .ab-era ul.hl{list-style:none;padding:0;margin:0}
#about-app .ab-era ul.hl li{position:relative;padding:.26rem 0 .26rem 1.05rem;font-size:.94rem;line-height:1.65}
#about-app .ab-era ul.hl li::before{content:"";position:absolute;left:.08rem;top:.85em;width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.8}
#about-app details.ab-full{border:1px solid var(--cardbd);border-radius:12px;background:var(--card);margin:.7rem 0 0;overflow:hidden}
#about-app details.ab-full[open]{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
#about-app details.ab-full summary{cursor:pointer;list-style:none;padding:.68rem 1.1rem;font-size:.88rem;font-weight:600;color:var(--muted);display:flex;align-items:center}
#about-app details.ab-full summary::-webkit-details-marker{display:none}
#about-app details.ab-full summary::after{content:"▾";margin-left:auto;color:var(--acc);transition:transform .2s}
#about-app details.ab-full[open] summary::after{transform:rotate(180deg)}
#about-app details.ab-full > ul{margin:0;padding:.3rem 1.1rem .6rem 1.5rem;list-style:none;border-top:1px solid var(--hair)}
#about-app details.ab-full > ul li{position:relative;padding:.32rem 0 .32rem .9rem;font-size:.88rem;color:var(--muted);line-height:1.55;border-bottom:1px dashed rgba(127,127,127,.13)}
#about-app details.ab-full > ul li:last-child{border-bottom:none}
#about-app details.ab-full > ul li::before{content:"";position:absolute;left:0;top:.75em;width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:.7}

/* ---------- 표·그림 ---------- */
#about-app table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--cardbd);
  border-radius:12px;overflow:hidden;margin:1rem 0;font-size:.93rem;display:table}
#about-app th{background:rgba(127,127,127,.1);text-align:left;padding:.65rem .9rem;font-weight:700;border-bottom:1px solid var(--cardbd);color:var(--text)}
#about-app td{padding:.6rem .9rem;border-bottom:1px solid var(--hair)}
#about-app tr:last-child td{border-bottom:none}
#about-app tbody tr:hover{background:rgba(127,127,127,.05)}
#about-app figure{margin:1.2rem auto;text-align:center}
#about-app figure img{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:100%;height:auto}
#about-app figcaption{color:var(--muted);font-size:.85rem;margin-top:.5rem}
#about-app .ab-foot{padding:40px 0 70px}
</style>

<div id="about-app">
{{ content }}
</div>

<script>
(function(){
  'use strict';
  var app=document.getElementById('about-app'); if(!app)return;
  var hero=document.getElementById('ab-hero');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function isLight(){return document.documentElement.getAttribute('data-theme')==='light';}

  /* ---------- 하프톤 도트 초상 ---------- */
  var face=document.getElementById('ab-face'),faceImg=null;
  var SILH=null; /* 흉상 실루엣의 방향별(5도 단위) 가장자리 반경 — 선 출발점용 */
  function renderFace(){
    if(!face||!faceImg)return;
    try{
      var light=isLight(),S=faceImg.naturalWidth||394;
      var off=document.createElement('canvas');off.width=S;off.height=S;
      var oc=off.getContext('2d');oc.drawImage(faceImg,0,0,S,S);
      var d=oc.getImageData(0,0,S,S).data;
      var bi=(2*S+2)*4,bgR=d[bi],bgG=d[bi+1],bgB=d[bi+2];
      var cx=face.getContext('2d'),W=480,cell=6,stepSrc=S/(W/cell);
      var hash=function(a,b){var h=a*374761393+b*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295;};
      cx.clearRect(0,0,W,W);
      var drawn=0,sil=[],si;
      for(si=0;si<72;si++)sil[si]=0;
      for(var gy=0;gy<W/cell;gy++)for(var gx=0;gx<W/cell;gx++){
        var sx=Math.min(S-1,Math.floor(gx*stepSrc)),sy=Math.min(S-1,Math.floor(gy*stepSrc));
        var i=(sy*S+sx)*4,r=d[i],g=d[i+1],b=d[i+2];
        if(Math.sqrt((r-bgR)*(r-bgR)+(g-bgG)*(g-bgG)+(b-bgB)*(b-bgB))<42)continue;
        var L=(0.2126*r+0.7152*g+0.0722*b)/255;
        var v=light?(1-L):L;
        var rr=Math.pow(v,0.75)*cell*0.62;
        var px=gx*cell+cell/2,py=gy*cell+cell/2;
        var dist=Math.sqrt((px-W*0.5)*(px-W*0.5)+(py-W*0.42)*(py-W*0.42))/(W*0.5);
        var fade=Math.max(0,Math.min(1,(1.08-dist)/0.30));
        if(fade<1&&hash(gx,gy)>fade)continue;
        rr*=0.7+fade*0.3;
        if(rr<0.35)continue;
        drawn++;
        cx.fillStyle=(v<0.5&&drawn%37===0)?(light?'#8a6414':'#e6b84a'):(light?'#1c2f45':'#cfdae6');
        cx.globalAlpha=(light?0.92:0.9)*(0.6+fade*0.4);
        cx.beginPath();cx.arc(px,py,rr,0,7);cx.fill();
        var ang=Math.atan2(py-W/2,px-W/2);
        var sb=(((ang*180/Math.PI+360)%360)/5)|0;
        var sd=Math.sqrt((px-W/2)*(px-W/2)+(py-W/2)*(py-W/2))/2;
        if(sd>sil[sb])sil[sb]=sd;
      }
      cx.globalAlpha=1;
      SILH=sil.map(function(v,i){return Math.max(v,sil[(i+71)%72],sil[(i+1)%72])||110;});
      draw(lastT);
    }catch(e){ /* getImageData 실패 시 원본 사진 폴백 */
      if(face&&face.parentNode){
        var im=document.createElement('img');im.src='/assets/dot-connector-portrait.png';im.alt='김진관';
        face.parentNode.replaceChild(im,face);face=null;
      }
    }
  }
  if(face){
    faceImg=new Image();
    faceImg.onload=renderFace;
    faceImg.src='/assets/dot-connector-portrait.png';
  }

  /* ---------- 그래프 레이아웃 + 연결선 ---------- */
  var lk=hero?hero.querySelector('.ab-links'):null;
  var me=hero?hero.querySelector('.ab-me'):null;
  var nodes=hero?[].slice.call(hero.querySelectorAll('.ab-node')):[];
  var PAIRS=[[2,3],[1,0],[5,6],[3,4]];
  var AMB=[],seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  for(var i=0;i<70;i++)AMB.push({x:rnd(),y:rnd(),r:0.8+rnd()*1.6,a:0.1+rnd()*0.28});
  var GM=false,mx=0,my=0,t0=0,rafId=null,heroVisible=true;
  var meX=0,meY=0,meR=126,lastT=0,prevTs=null;
  function qpt(p,x0,y0,qx,qy,x1,y1){
    var u=1-p;
    return [u*u*x0+2*u*p*qx+p*p*x1, u*u*y0+2*u*p*qy+p*p*y1];
  }
  function strokePath(c,pts,style,lw){
    c.strokeStyle=style;c.lineWidth=lw;
    c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    for(var k=1;k<pts.length;k++)c.lineTo(pts[k][0],pts[k][1]);
    c.stroke();
  }

  function layout(){
    var want=window.innerWidth>=1260&&!!lk;
    GM=want;
    if(hero)hero.classList.toggle('gm',want);
    if(!want){
      nodes.forEach(function(el){el.style.left='';el.style.top='';el.style.transform='';});
      if(me){me.style.left='';me.style.top='';}
      stopLoop();return;
    }
    var heroRect=hero.getBoundingClientRect(),W=heroRect.width,H=heroRect.height;
    nodes.forEach(function(el){
      el._bx=parseFloat(el.dataset.x)/100*W;
      el._by=parseFloat(el.dataset.y)/100*H;
      el.style.left=el._bx+'px';el.style.top=el._by+'px';
      el._dx=0;el._dy=0;el._tx=0;el._ty=0;
    });
    if(me){me.style.left=W*0.5+'px';me.style.top=H*0.5+'px';}
    var ringEl=me?me.querySelector('.ab-ring'):null;
    if(ringEl){
      var rr=ringEl.getBoundingClientRect();
      meX=rr.left+rr.width/2-heroRect.left;meY=rr.top+rr.height/2-heroRect.top;meR=rr.width/2-9;
    }else{meX=W*0.5;meY=H*0.5;meR=126;}
    /* 헤드 블록(제목·인트로·칩) 실측 사각형과 겹치는 노드는 그 아래로 밀어냄 —
       폰트 로딩·줄바꿈 변화에도 겹침이 생기지 않도록 좌표가 아니라 측정으로 해소 */
    var head=hero.querySelector('.ab-head');
    if(head){
      var kids=[].slice.call(head.children).map(function(k){
        var r=k.getBoundingClientRect();
        return {l:r.left-heroRect.left,t:r.top-heroRect.top,r:r.right-heroRect.left,b:r.bottom-heroRect.top};
      });
      nodes.forEach(function(el){
        var w=el.offsetWidth,h=el.offsetHeight,PAD=12;
        var nl=el._bx-w/2,nt=el._by-h/2,nr=el._bx+w/2,nb=el._by+h/2;
        var hit=false,needB=0,needR=0;
        kids.forEach(function(k){
          if(nl<k.r+PAD&&nr>k.l-PAD&&nt<k.b+PAD&&nb>k.t-PAD)hit=true;
          if(nl<k.r+PAD&&nr>k.l-PAD)needB=Math.max(needB,k.b+PAD);
          if(nt<k.b+PAD&&nb>k.t-PAD)needR=Math.max(needR,k.r+PAD);
        });
        if(hit){
          var dDown=(needB+h/2)-el._by,dRight=(needR+w/2)-el._bx;
          if(dDown<=dRight)el._by=Math.min(needB+h/2,H-h/2-84);
          else el._bx=Math.min(needR+w/2,W-w/2-8);
          el.style.left=el._bx+'px';el.style.top=el._by+'px';
        }
      });
    }
    draw();
    if(!reduce)startLoop();
  }
  function draw(t){
    if(!GM||!lk)return;
    var rect=hero.getBoundingClientRect(),W=rect.width,H=rect.height;
    var dpr=Math.min(2,window.devicePixelRatio||1);
    if(lk.width!==Math.round(W*dpr)){lk.width=Math.round(W*dpr);lk.height=Math.round(H*dpr);}
    var c=lk.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    var light=isLight();
    var blue=light?'9,105,218':'88,166,255';
    var amber=light?'#a8781a':'#e6b84a';
    AMB.forEach(function(p,ai){
      c.fillStyle=(ai%9===0)?amber:(light?'#6b7280':'#7d8590');
      c.globalAlpha=(ai%9===0)?p.a*0.9:p.a;
      c.beginPath();c.arc(p.x*W,p.y*H,p.r,0,7);c.fill();
    });
    c.globalAlpha=1;
    var cxp=meX||0.5*W,cyp=meY||0.5*H,R0=meR||126;
    c.setLineDash([]);
    /* 오로라 스레드 팔레트 — 사람(앰버)에서 성과(시안블루)로 식어 가는 그라디언트 */
    var A1=light?'176,125,24':'230,184,74';
    var A2=light?'209,86,124':'241,143,165';
    var A3=light?'109,79,216':'157,140,255';
    var A4=light?'9,105,218':'108,184,255';
    var cometHead=light?'#5b43c9':'#ffffff';
    var cometGlow=light?'#6d4fd8':'#9d8cff';
    nodes.forEach(function(el,i){
      var x=(el._bx||0)+(el._dx||0),y=(el._by||0)+(el._dy||0);
      var dx=x-cxp,dy=y-cyp,len=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/len,uy=dy/len;
      /* 실측한 흉상 실루엣 가장자리에서 출발 (실루엣 미계산 시 링 반경 폴백) */
      var ang=Math.atan2(dy,dx);
      var base=SILH?SILH[(((ang*180/Math.PI+360)%360)/5)|0]:R0;
      var R=Math.min(142,Math.max(38,base+7));
      var x0=cxp+ux*R,y0=cyp+uy*R;
      /* 곡선 숨쉬기 — 곡률이 미세하게 진동 */
      var bow=(len-R0)*0.16*(1+0.05*Math.sin((t||0)*0.6+i*1.3));
      var mxp=(x0+x)/2,myp=(y0+y)/2;
      var qx=mxp-uy*bow,qy=myp+ux*bow;
      /* 드로우-인 — 첫 진입 시 실루엣에서 노드로 시차를 두고 그려짐 */
      var ip=reduce?1:Math.min(1,Math.max(0,((t||0)-0.05-i*0.06)/0.8));
      ip=1-Math.pow(1-ip,3);
      if(ip<=0.005)return;
      var N=24,pts=[],k;
      for(k=0;k<=N;k++)pts.push(qpt(k/N*ip,x0,y0,qx,qy,x,y));
      var hv=el._hotV||0,ha=1+hv*0.6;
      strokePath(c,pts,'rgba('+A3+','+(0.08+hv*0.07).toFixed(3)+')',3.4+hv*1.8);
      var g2=c.createLinearGradient(x0,y0,x,y);
      g2.addColorStop(0,'rgba('+A1+','+Math.min(1,0.8*ha).toFixed(3)+')');
      g2.addColorStop(0.42,'rgba('+A2+','+Math.min(1,0.5*ha).toFixed(3)+')');
      g2.addColorStop(0.75,'rgba('+A3+','+Math.min(1,0.46*ha).toFixed(3)+')');
      g2.addColorStop(1,'rgba('+A4+','+Math.min(1,0.62*ha).toFixed(3)+')');
      strokePath(c,pts,g2,1.25+hv*0.65);
      c.fillStyle=amber;c.globalAlpha=.9*ip;
      c.beginPath();c.arc(x0,y0,2.1,0,7);c.fill();c.globalAlpha=1;
      /* 흐르는 빛 입자 — 사람에서 성과로 */
      if(!reduce&&ip>=1){
        var cp=el._cp||0,j,tp,pt;
        for(j=3;j>=0;j--){
          tp=cp-j*0.028;if(tp<0)continue;
          pt=qpt(tp,x0,y0,qx,qy,x,y);
          c.globalAlpha=(j===0?0.95:0.4-j*0.09)*(0.7+hv*0.3);
          c.fillStyle=cometHead;
          if(j===0){c.shadowBlur=7;c.shadowColor=cometGlow;}
          c.beginPath();c.arc(pt[0],pt[1],j===0?2.3:1.5-j*0.25,0,7);c.fill();
          c.shadowBlur=0;
        }
        c.globalAlpha=1;
      }
    });
    c.strokeStyle='rgba('+A3+',.15)';c.lineWidth=0.9;c.setLineDash([4,7]);
    c.lineDashOffset=-(((t||0)*12)%22);
    PAIRS.forEach(function(pr){
      var a=nodes[pr[0]],b=nodes[pr[1]];if(!a||!b)return;
      var ax=(a._bx||0)+(a._dx||0),ay=(a._by||0)+(a._dy||0);
      var bx=(b._bx||0)+(b._dx||0),by=(b._by||0)+(b._dy||0);
      c.beginPath();c.moveTo(ax,ay);
      c.quadraticCurveTo((ax+bx)/2+18,(ay+by)/2+14,bx,by);c.stroke();
    });
    c.setLineDash([]);c.lineDashOffset=0;
  }
  function tick(ts){
    rafId=null;
    if(!GM||!heroVisible)return;
    if(!t0)t0=ts;
    var t=(ts-t0)/1000;
    var dt=prevTs==null?0.016:Math.min(0.05,(ts-prevTs)/1000);prevTs=ts;
    nodes.forEach(function(el,i){
      el._hotV=(el._hotV||0)+((el._hot?1:0)-(el._hotV||0))*0.1;
      el._cp=((el._cp!=null?el._cp:i*0.13)+dt*(0.3+(el._hotV||0)*0.55))%1;
      var depth=parseFloat(el.dataset.d)||1;
      var ix=Math.sin(t*0.5+i*1.7)*2.4,iy=Math.cos(t*0.42+i*1.3)*2.2;
      el._tx=mx*depth*16+ix;el._ty=my*depth*12+iy;
      el._dx=(el._dx||0)+((el._tx-(el._dx||0))*0.06);
      el._dy=(el._dy||0)+((el._ty-(el._dy||0))*0.06);
      el.style.transform='translate(calc(-50% + '+el._dx.toFixed(2)+'px), calc(-50% + '+el._dy.toFixed(2)+'px))';
    });
    lastT=t;draw(t);
    rafId=requestAnimationFrame(tick);
  }
  function startLoop(){if(rafId==null&&!reduce)rafId=requestAnimationFrame(tick);}
  function stopLoop(){if(rafId!=null){cancelAnimationFrame(rafId);rafId=null;}prevTs=null;}
  if(hero&&lk){
    nodes.forEach(function(el){
      el.addEventListener('mouseenter',function(){el._hot=1;});
      el.addEventListener('mouseleave',function(){el._hot=0;});
    });
    hero.addEventListener('mousemove',function(e){
      var r=hero.getBoundingClientRect();
      mx=(e.clientX-r.left)/r.width-0.5;my=(e.clientY-r.top)/r.height-0.5;
    });
    hero.addEventListener('mouseleave',function(){mx=0;my=0;});
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){
        es.forEach(function(en){heroVisible=en.isIntersecting;});
        if(heroVisible&&GM)startLoop();else stopLoop();
      }).observe(hero);
    }
    var rt=null;
    window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150);});
    layout();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  }

  /* ---------- 테마 전환 시 캔버스 다시 그림 ---------- */
  if('MutationObserver' in window){
    new MutationObserver(function(){renderFace();draw(lastT);})
      .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }

  /* ---------- 숫자 카운트업 ---------- */
  var stats=app.querySelector('.ab-stats');
  if(stats&&!reduce&&'IntersectionObserver' in window){
    var counted=false;
    var io2=new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(!en.isIntersecting||counted)return;
        counted=true;io2.disconnect();
        [].slice.call(stats.querySelectorAll('.n')).forEach(function(el){
          var node=el.firstChild;if(!node||node.nodeType!==3)return;
          var target=parseInt(node.nodeValue,10);if(!target)return;
          var s0=null;
          function st(ts){
            if(!s0)s0=ts;
            var p=Math.min(1,(ts-s0)/900);p=1-Math.pow(1-p,3);
            node.nodeValue=String(Math.round(target*p));
            if(p<1)requestAnimationFrame(st);
          }
          requestAnimationFrame(st);
        });
      });
    },{threshold:.35});
    io2.observe(stats);
  }

  /* ---------- 스크롤 리빌 ---------- */
  if(!reduce&&'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
    },{rootMargin:'0px 0px -8% 0px'});
    [].slice.call(app.querySelectorAll('.ab-sec, .ab-stats')).forEach(function(el){
      el.classList.add('rv');io.observe(el);
    });
  }
})();
</script>
