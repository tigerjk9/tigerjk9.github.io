---
layout: default
---
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
#about-app{
  --acc:#58a6ff; --amber:#e6b84a;
  --text:#e6edf3; --body:#c2ccd6; --muted:#7d8590;
  --line:rgba(240,246,252,.1); --hair:rgba(240,246,252,.08);
  --nodebg:rgba(20,27,38,.72); --nodebd:rgba(88,166,255,.3);
  --card:rgba(255,255,255,.045); --cardbd:rgba(255,255,255,.11);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  color:var(--body); word-break:keep-all;
  overflow-x:hidden; overflow-x:clip; /* clip: 스크롤 컨테이너化 방지(이중 스크롤바) */
}
html[data-theme="light"] #about-app{
  --acc:#0969da; --amber:#a8781a;
  --text:#1f2328; --body:#3d454e; --muted:#6b7280;
  --line:rgba(31,35,40,.12); --hair:rgba(31,35,40,.09);
  --nodebg:rgba(255,255,255,.82); --nodebd:rgba(9,105,218,.26);
  --card:#fff; --cardbd:#e7e2d6;
}
#about-app .ab-wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* ---------- 스크롤 리빌 (JS가 .rv 부여, no-JS면 항상 보임) ---------- */
#about-app .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
#about-app .rv.in{opacity:1;transform:none}

/* ---------- 그래프 히어로 ---------- */
#about-app .ab-hero{position:relative;max-width:1440px;margin:0 auto;padding:40px 24px 8px;background:radial-gradient(58% 48% at 20% 16%,rgba(120,90,230,.16),transparent 70%),radial-gradient(52% 46% at 84% 28%,rgba(30,130,200,.13),transparent 72%),radial-gradient(48% 52% at 62% 92%,rgba(150,70,200,.10),transparent 72%)}
/* 라이트 모드 히어로 — 플랫 화이트 대신 오로라 팔레트의 옅은 기운 */
html[data-theme="light"] #about-app .ab-hero{
  background:
    radial-gradient(52% 42% at 16% 10%, rgba(176,125,24,.07), transparent 70%),
    radial-gradient(46% 40% at 84% 26%, rgba(9,105,218,.06), transparent 70%),
    radial-gradient(42% 38% at 55% 82%, rgba(109,79,216,.05), transparent 72%)}
#about-app .ab-links{display:none}
#about-app .ab-eyebrow{display:flex;align-items:center;gap:2px;font-size:.8rem;font-weight:600;
  letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:0 0 16px}
#about-app .ab-eyebrow i{font-style:normal;color:var(--amber);margin:0 .5em}
#about-app .ab-head h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.16;font-weight:900;
  letter-spacing:-.04em;color:var(--text);margin:0}
#about-app .ab-head h1 em{font-style:normal;color:var(--acc)}
#about-app .ab-intro{margin:18px 0 0;font-size:1.02rem;line-height:1.85;max-width:440px}
#about-app .ab-intro b{color:var(--text);font-weight:600}
#about-app .ab-chips{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:7px;margin:26px auto 0;max-width:600px}
#about-app .ab-chips span{display:inline-flex;align-items:center;gap:.5em;
  padding:.36em .95em;border:1px solid color-mix(in srgb,var(--acc) 20%,var(--line));border-radius:999px;
  font-size:.78rem;font-weight:500;color:var(--body);letter-spacing:.01em;
  background:color-mix(in srgb,var(--acc) 5%,transparent);
  transition:color .2s,border-color .2s,box-shadow .2s}
#about-app .ab-chips span::before{content:"";width:5px;height:5px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,var(--amber),var(--acc))}
#about-app .ab-chips span:hover{color:var(--text);border-color:color-mix(in srgb,var(--acc) 45%,transparent);
  box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 14%,transparent)}

/* ---------- 캐리커처 (버블헤드: 몸통·손·머리 3레이어, 같은 캔버스 크기) ---------- */
#about-app .ab-me{position:relative;margin:96px auto 0;text-align:center;width:max-content;max-width:100%}
#about-app .ab-buddy{position:relative;display:block;height:330px;aspect-ratio:371/894;margin:0 auto;
  padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#about-app .ab-buddy:focus-visible{outline:2px dashed var(--amber);outline-offset:10px;border-radius:24px}
/* 무대 조명 — 발밑에 오로라 빛이 고인다 */
#about-app .ab-buddy::before{content:"";position:absolute;left:50%;bottom:-18px;width:230%;height:30%;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(230,184,74,.16),rgba(157,140,255,.09) 58%,transparent)}
html[data-theme="light"] #about-app .ab-buddy::before{
  background:radial-gradient(closest-side,rgba(176,125,24,.12),rgba(109,79,216,.06) 58%,transparent)}
#about-app .bh-shadow{position:absolute;left:50%;bottom:-7px;width:74%;height:16px;border-radius:50%;
  transform:translateX(-50%);transform-origin:50% 50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
html[data-theme="light"] #about-app .bh-shadow{background:radial-gradient(closest-side,rgba(31,35,40,.26),transparent)}
#about-app .bh-fig{position:absolute;inset:0;transform-origin:50% 100%}
/* 테마가 span·img·p·figure에 transition:all .2s를 걸어 둔다 — 매 프레임 쓰는 transform이
   0.2초씩 뒤처져 흔들림이 뭉개지므로 캐릭터·말풍선에서는 끈다 */
#about-app .ab-me,#about-app .bh-fig,#about-app .bh-fig img,#about-app .bh-shadow,#about-app .ab-say,#about-app .ab-say span{transition:none}
#about-app .bh-fig img{position:absolute;inset:0;width:100%;height:100%;max-width:none;
  border-radius:0;box-shadow:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
/* 회전축: 머리는 목 밑동, 손은 손목 (원본 실측 좌표를 크롭 비율로 환산) */
#about-app .bh-head{transform-origin:57.41% 42.95%}
#about-app .bh-hand{transform-origin:14.29% 48.55%}
@media (hover:hover){#about-app .ab-buddy:hover .bh-fig{filter:drop-shadow(0 12px 26px rgba(230,184,74,.22))}}
/* 테마의 button:focus 링이 마우스 클릭마다 캐릭터 전체를 감싸지 않게 — 키보드 포커스만 표시 */
#about-app .ab-buddy:focus:not(:focus-visible){outline:none}
#about-app .ab-me figcaption{margin-top:16px;font-family:inherit;font-size:.85rem;color:var(--muted)}
#about-app .ab-me figcaption b{display:block;color:var(--text);font-weight:700;font-size:1rem}

/* 말풍선 — 고스트 텍스트로 크기를 먼저 잡고, 그 위에 타자 효과 텍스트를 겹친다 */
#about-app .ab-say{position:absolute;left:50%;bottom:calc(100% + 14px);z-index:4;margin:0;
  translate:-50% 0;transform-origin:50% 100%;
  width:max-content;max-width:min(250px,84vw);padding:.6em 1em;border-radius:16px;
  background:var(--saybg,#161d29);border:1px solid color-mix(in srgb,var(--amber) 42%,transparent);
  color:var(--text);font-size:.88rem;font-weight:600;line-height:1.5;text-align:left;letter-spacing:-.01em;
  box-shadow:0 10px 28px rgba(2,8,20,.38);pointer-events:none}
html[data-theme="light"] #about-app .ab-say{--saybg:#fff;box-shadow:0 10px 26px rgba(31,35,40,.12)}
#about-app .ab-say::after{content:"";position:absolute;left:50%;top:100%;width:11px;height:11px;
  background:var(--saybg,#161d29);border-right:1px solid color-mix(in srgb,var(--amber) 42%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--amber) 42%,transparent);
  transform:translate(-50%,-5.5px) rotate(45deg)}
#about-app .ab-say .g{visibility:hidden}
#about-app .ab-say .l{position:absolute;left:1em;right:1em;top:.6em}
#about-app .ab-say.pop{animation:ab-pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes ab-pop{from{scale:.8;opacity:0}to{scale:1;opacity:1}}
@media (prefers-reduced-motion:reduce){#about-app .ab-say.pop{animation:none}}

#about-app .ab-nodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
  margin:26px auto 0;max-width:560px}
#about-app .ab-node{display:block;background:var(--nodebg);border:1px solid var(--nodebd);
  border-radius:16px;padding:.6em 1.1em;text-align:center;text-decoration:none;
  box-shadow:0 8px 26px rgba(2,8,20,.42),0 0 0 1px rgba(120,200,255,.05),0 0 20px rgba(96,196,255,.07);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  transition:border-color .2s,transform .2s,box-shadow .2s}
#about-app .ab-node:hover{border-color:var(--amber);transform:translateY(-2px);
  box-shadow:0 12px 32px color-mix(in srgb,var(--acc) 20%,transparent)}
#about-app .ab-node .t{display:block;font-size:.93rem;font-weight:700;color:var(--text);letter-spacing:-.01em}
#about-app .ab-node .t em{font-style:normal;font-size:.82em;font-weight:700;color:var(--acc);margin-left:.4em}
#about-app .ab-node .s{display:block;font-size:.73rem;color:var(--muted);margin-top:2px}

/* 스택 모드(모바일·태블릿): 연결선 없이 카드 그리드. 홀수 개면 마지막 카드는 한 줄 전체 */
#about-app .ab-hero:not(.gm) .ab-nodes{margin-top:30px}
#about-app .ab-hero:not(.gm) .ab-node:last-child:nth-child(odd){grid-column:1/-1}

/* 스택 모드 넓은 화면: 헤드 중앙 정렬 (그래프 모드 미만 태블릿·데스크톱) */
@media (min-width:700px){
  #about-app .ab-hero:not(.gm) .ab-head{max-width:640px;margin:0 auto;text-align:center}
  #about-app .ab-hero:not(.gm) .ab-eyebrow{justify-content:center}
  #about-app .ab-hero:not(.gm) .ab-intro{margin-left:auto;margin-right:auto;max-width:560px}
  #about-app .ab-hero:not(.gm) .ab-chips{justify-content:center;max-width:640px;margin-left:auto;margin-right:auto}
}

/* 그래프 모드 (JS가 1260px 이상에서 .gm 부여) */
#about-app .ab-hero.gm{height:700px;padding:0;overflow:hidden}
#about-app .gm .ab-links{display:block;position:absolute;inset:0;width:100%;height:100%}
#about-app .gm .ab-head{position:absolute;left:56px;top:64px;z-index:3;max-width:460px}
#about-app .gm .ab-head h1{font-size:4.1rem}
#about-app .gm .ab-me{position:absolute;z-index:4;margin:0;left:50%;bottom:82px;transform:translateX(-50%)}
#about-app .gm .ab-buddy{height:430px}
/* 그래프 모드 말풍선: 머리 오른쪽 위, 꼬리는 왼쪽 아래(머리 쪽) */
#about-app .gm .ab-say{left:94%;bottom:auto;top:-30px;translate:none;transform-origin:0 100%;max-width:280px}
#about-app .gm .ab-say::after{left:18px;transform:translate(0,-5.5px) rotate(45deg)}
#about-app .gm .ab-nodes{display:contents}
#about-app .gm .ab-node{position:absolute;z-index:2;white-space:nowrap;border-radius:999px;
  transform:translate(-50%,-50%)}
#about-app .gm .ab-node:hover{transform:translate(-50%,-52%)}
#about-app .gm .ab-chips{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  margin:0;max-width:none;width:max-content;z-index:3}

/* ---------- 숫자 밴드 ---------- */
#about-app .ab-stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-top:34px}
#about-app .ab-stats .in{display:grid;grid-template-columns:repeat(4,1fr)}
#about-app .ab-stats .st{padding:34px 8px 30px;text-align:center;position:relative}
#about-app .ab-stats .st+.st::before{content:"";position:absolute;left:0;top:30%;height:40%;width:1px;background:var(--line)}
#about-app .ab-stats .n{margin:0;font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:900;letter-spacing:-.03em;color:var(--text)}
#about-app .ab-stats .n em{font-style:normal;color:var(--acc);font-size:.6em;font-weight:700;margin-left:2px}
#about-app .ab-stats .l{margin:7px 0 0;font-size:.85rem;color:var(--muted)}
@media (max-width:700px){
  #about-app .ab-stats .in{grid-template-columns:repeat(2,1fr)}
  #about-app .ab-stats .st:nth-child(3)::before{display:none}
}

/* ---------- 공통 섹션 ---------- */
#about-app .ab-sec{padding:58px 0 6px}
#about-app .ab-sec h2{font-size:1.7rem;font-weight:900;letter-spacing:-.03em;color:var(--text);
  margin:0 0 .5em;padding-bottom:.45em;border-bottom:1px solid var(--line)}
#about-app .ab-sec h2::before{content:"";display:inline-block;width:.5rem;height:1rem;vertical-align:-1px;
  background:linear-gradient(var(--acc),var(--amber));border-radius:3px;margin-right:.55rem}
#about-app .ab-sub{margin:-.2em 0 1.6em;font-size:.9rem;color:var(--muted)}
#about-app .ab-sec a{color:var(--acc);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
#about-app .ab-sec a:hover{border-bottom-color:var(--acc)}
#about-app .ab-sec > ul,#about-app .ab-sec section > ul{list-style:none;padding-left:0}
#about-app .ab-sec > ul li,#about-app .ab-sec section > ul li{position:relative;padding:.3rem 0 .3rem 1.1rem;line-height:1.65}
#about-app .ab-sec > ul li::before,#about-app .ab-sec section > ul li::before{content:"";position:absolute;left:.12rem;top:.75em;
  width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* ---------- 소개 영상 (세로 9:16) ---------- */
#about-app .ab-reel-in{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:48px;align-items:center}
#about-app .ab-reel-frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:22px;overflow:hidden;
  background:#05070c;border:1px solid var(--cardbd);
  box-shadow:0 26px 60px rgba(2,8,20,.5),0 0 40px rgba(157,140,255,.08)}
html[data-theme="light"] #about-app .ab-reel-frame{box-shadow:0 22px 48px rgba(31,35,40,.18)}
#about-app .ab-reel-frame::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(230,184,74,.95),rgba(241,143,165,.8) 34%,rgba(157,140,255,.8) 66%,rgba(108,184,255,.95))}
#about-app .ab-reel-frame video{display:block;width:100%;height:100%;object-fit:cover;background:#05070c}
#about-app .ab-reel-q{margin:0 0 1.4rem;padding:0;border:0;background:none;font-style:normal}
#about-app .ab-reel-q p{margin:0 0 .9rem;font-size:clamp(1.35rem,2.6vw,1.9rem);line-height:1.4;font-weight:800;
  letter-spacing:-.03em;color:var(--text)}
#about-app .ab-reel-q em{font-style:normal;background:linear-gradient(90deg,#e6b84a,#f18fa5 40%,#9d8cff 72%,#6cb8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="light"] #about-app .ab-reel-q em{background-image:linear-gradient(90deg,#b07d18,#d1567c 40%,#6d4fd8 72%,#0969da)}
#about-app .ab-reel-copy > p{margin:0;font-size:.98rem;line-height:1.8}
@media (max-width:760px){
  #about-app .ab-reel-in{grid-template-columns:1fr;gap:26px;justify-items:center}
  #about-app .ab-reel-frame{max-width:300px}
  #about-app .ab-reel-copy{text-align:center}
}

/* ---------- 지금 (현직) — 오로라 상단 스레드 패널 ---------- */
#about-app .ab-now{position:relative;border:1px solid var(--cardbd);background:var(--card);
  border-radius:16px;padding:1.15rem 1.5rem;margin:0 0 2.2rem;overflow:hidden}
#about-app .ab-now::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,rgba(230,184,74,.95),rgba(241,143,165,.8) 34%,rgba(157,140,255,.8) 66%,rgba(108,184,255,.95))}
html[data-theme="light"] #about-app .ab-now::before{
  background:linear-gradient(90deg,rgba(176,125,24,.95),rgba(209,86,124,.8) 34%,rgba(109,79,216,.8) 66%,rgba(9,105,218,.95))}
#about-app .ab-now ul{list-style:none;padding:0;margin:0}
@media (min-width:760px){
  #about-app .ab-now ul{columns:2;column-gap:2.4rem}
  #about-app .ab-now li{break-inside:avoid}
}
#about-app .ab-now li{position:relative;padding:.28rem 0 .28rem 1.1rem;line-height:1.65}
#about-app .ab-now li::before{content:"";position:absolute;left:.1rem;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--acc)}

/* ---------- 타임라인 ---------- */
#about-app .ab-tl{position:relative;padding-left:34px}
#about-app .ab-tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,rgba(230,184,74,.9),rgba(241,143,165,.6) 32%,rgba(157,140,255,.55) 66%,rgba(108,184,255,.12))}
html[data-theme="light"] #about-app .ab-tl::before{
  background:linear-gradient(180deg,rgba(176,125,24,.85),rgba(209,86,124,.55) 32%,rgba(109,79,216,.5) 66%,rgba(9,105,218,.1))}
#about-app .ab-era{position:relative;padding:0 0 40px 22px}
#about-app .ab-era::before{content:"";position:absolute;left:-32px;top:4px;width:13px;height:13px;border-radius:50%;
  background:var(--amber);border:3px solid var(--card);box-shadow:0 0 0 2px var(--amber)}
#about-app .ab-era .yr{margin:0;font-size:.84rem;font-weight:700;letter-spacing:.14em;color:var(--acc)}
#about-app .ab-era h3{margin:.35em 0 .65em;font-size:1.24rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
#about-app .ab-era ul.hl{list-style:none;padding:0;margin:0}
#about-app .ab-era ul.hl li{position:relative;padding:.26rem 0 .26rem 1.05rem;font-size:.94rem;line-height:1.65}
#about-app .ab-era ul.hl li::before{content:"";position:absolute;left:.08rem;top:.85em;width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.8}
/* 전체 기록 펼치기 — 폼컨트롤형 회색 바 대신 알약 버튼 + 펼침 패널 */
#about-app details.ab-full{border:none;background:none;margin:.85rem 0 0;overflow:visible}
#about-app details.ab-full summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:.45em;
  width:fit-content;padding:.52em 1.2em;border:1px solid var(--cardbd);border-radius:999px;background:var(--card);
  font-size:.85rem;font-weight:600;color:var(--muted);
  transition:color .18s,border-color .18s,transform .18s,box-shadow .18s}
#about-app details.ab-full summary:hover{color:var(--text);
  border-color:color-mix(in srgb,var(--acc) 45%,transparent);transform:translateY(-1px);
  box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 12%,transparent)}
#about-app details.ab-full summary::-webkit-details-marker{display:none}
#about-app details.ab-full summary::after{content:"▾";margin-left:.2em;color:var(--acc);transition:transform .2s}
#about-app details.ab-full[open] summary{color:var(--text);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
#about-app details.ab-full[open] summary::after{transform:rotate(180deg)}
#about-app details.ab-full > ul{margin:.75rem 0 0;padding:.45rem 1.2rem .55rem 1.6rem;list-style:none;
  border:1px solid var(--cardbd);border-radius:14px;background:var(--card)}
#about-app details.ab-full > ul li{position:relative;padding:.32rem 0 .32rem .9rem;font-size:.88rem;color:var(--muted);line-height:1.55;border-bottom:1px dashed rgba(127,127,127,.13)}
#about-app details.ab-full > ul li:last-child{border-bottom:none}
#about-app details.ab-full > ul li::before{content:"";position:absolute;left:0;top:.75em;width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:.7}

/* ---------- 표·그림 ---------- */
#about-app table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--cardbd);
  border-radius:12px;overflow:hidden;margin:1rem 0;font-size:.93rem;display:table}
#about-app th{background:rgba(127,127,127,.1);text-align:left;padding:.65rem .9rem;font-weight:700;border-bottom:1px solid var(--cardbd);color:var(--text)}
#about-app td{padding:.6rem .9rem;border-bottom:1px solid var(--hair)}
#about-app tr:last-child td{border-bottom:none}
#about-app tbody tr:hover{background:rgba(127,127,127,.05)}
#about-app figure{display:block;margin:1.2rem auto;text-align:center}
#about-app figure img{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:100%;height:auto}
#about-app figcaption{width:100%;text-align:center;color:var(--muted);font-size:.85rem;margin-top:.5rem}
#about-app .ab-foot{padding:40px 0 70px}
</style>

<div id="about-app">
{{ content }}
</div>

<script>
(function(){
  'use strict';
  var app=document.getElementById('about-app'); if(!app)return;
  var hero=document.getElementById('ab-hero');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function isLight(){return document.documentElement.getAttribute('data-theme')==='light';}

  /* ---------- 캐리커처: 버블헤드 + 손 인사 + 말풍선 ----------
     머리는 목 밑동을 축으로 감쇠 스프링(살짝 덜 감쇠돼 '보잉' 하고 출렁임),
     손은 손목을 축으로 흔든다. 누르면 머리가 출렁이며 깡충 뛰고,
     섹션 노드에 올리면 그쪽으로 고개를 갸웃하며 노드 이야기를 말한다. */
  var buddy=document.getElementById('ab-buddy');
  var bHead=buddy?buddy.querySelector('.bh-head'):null;
  var bHand=buddy?buddy.querySelector('.bh-hand'):null;
  var bFig=buddy?buddy.querySelector('.bh-fig'):null;
  var bShadow=buddy?buddy.querySelector('.bh-shadow'):null;
  var sayEl=document.getElementById('ab-say');
  var sayGhost=sayEl?sayEl.querySelector('.g'):null,sayLive=sayEl?sayEl.querySelector('.l'):null;
  function splitLines(attr){return ((buddy&&buddy.getAttribute(attr))||'').split('|').filter(function(s){return s;});}
  var IDLE=splitLines('data-lines'),POKE=splitLines('data-poke');
  var idleI=0,pokeI=0,typeTimer=null,holdUntil=0;
  function speak(text,hold){
    if(!sayEl||!sayGhost||!sayLive||!text)return;
    holdUntil=Date.now()+(hold||5200);
    sayGhost.textContent=text;
    sayEl.classList.remove('pop');void sayEl.offsetWidth;sayEl.classList.add('pop');
    clearInterval(typeTimer);
    if(reduce){sayLive.textContent=text;return;}
    var n=0;sayLive.textContent='';
    typeTimer=setInterval(function(){
      n++;sayLive.textContent=text.slice(0,n);
      if(n>=text.length)clearInterval(typeTimer);
    },36);
  }
  var B={ang:0,vel:0,lift:0,liftV:0,hop:0,hopV:0,lean:0,look:0,wave:-9,t:0,t0:null,prev:null,raf:null,vis:true};
  function wave(){B.wave=B.t;}
  function boing(){
    B.vel+=(Math.random()<0.5?-1:1)*(110+Math.random()*50);
    B.liftV-=150;
    if(B.hop>-2)B.hopV=-240;
    wave();
  }
  function btick(ts){
    B.raf=null;
    if(!B.vis||document.hidden)return;
    if(B.t0==null)B.t0=ts;
    var dt=B.prev==null?0.016:Math.min(0.04,(ts-B.prev)/1000);B.prev=ts;
    var t=B.t=(ts-B.t0)/1000;
    /* 머리: 숨쉬듯 살랑 + 커서 쪽으로 기울기 + 노드 쪽 갸웃 */
    var target=Math.sin(t*1.5)*2+B.lean*6+B.look;
    B.vel+=((target-B.ang)*150-B.vel*4.4)*dt;B.ang+=B.vel*dt;
    if(B.ang>15){B.ang=15;B.vel*=-0.4;}else if(B.ang<-15){B.ang=-15;B.vel*=-0.4;}
    /* 목 스프링: 머리가 위로 '뽕' 솟았다 출렁이며 내려앉는다 */
    B.liftV+=((-B.lift)*220-B.liftV*5)*dt;B.lift+=B.liftV*dt;
    if(B.lift<-14){B.lift=-14;B.liftV*=-0.3;}else if(B.lift>3){B.lift=3;B.liftV*=-0.3;}
    /* 깡충: 중력 */
    B.hopV+=1000*dt;B.hop+=B.hopV*dt;if(B.hop>0){B.hop=0;B.hopV=0;}
    /* 손: 인사할 때 크게 흔들고 평소엔 아주 조금 */
    var w=t-B.wave,h=(w>=0&&w<1.5)?-Math.sin(w*14)*20*Math.sin(w/1.5*Math.PI):Math.sin(t*1.2)*2.5;
    bHead.style.transform='translateY('+B.lift.toFixed(1)+'px) rotate('+B.ang.toFixed(2)+'deg)';
    bHand.style.transform='rotate('+h.toFixed(2)+'deg)';
    bFig.style.transform='translateY('+B.hop.toFixed(1)+'px)';
    if(bShadow)bShadow.style.transform='translateX(-50%) scale('+Math.max(0.6,1+B.hop/120).toFixed(3)+')';
    B.raf=requestAnimationFrame(btick);
  }
  function bStart(){if(B.raf==null&&!reduce&&bHead&&bHand&&bFig){B.prev=null;B.raf=requestAnimationFrame(btick);}}
  if(buddy){
    buddy.addEventListener('click',function(){
      if(!reduce)boing();
      if(POKE.length){speak(POKE[pokeI%POKE.length],3800);pokeI++;}
    });
    /* 평소 대사는 한 바퀴만 돌고 마지막 줄에 멈춘다(자동으로 끝없이 바뀌는 글 방지).
       동작 줄이기 설정이면 첫 인사만 정적으로 둔다. */
    if(IDLE.length&&!reduce){
      if(sayLive)sayLive.textContent='';
      setTimeout(function(){wave();if(Date.now()>=holdUntil)speak(IDLE[0],5200);},450);
      var idleTimer=setInterval(function(){
        if(document.hidden||!B.vis||Date.now()<holdUntil)return;
        idleI++;
        if(idleI>=IDLE.length){clearInterval(idleTimer);return;}
        speak(IDLE[idleI],5200);
        if(idleI%2===0)wave();
      },5600);
    }
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&B.vis)bStart();});
    bStart();
  }

  /* ---------- 그래프 모드 레이아웃 (노드 배치 + 별 배경) ---------- */
  var lk=hero?hero.querySelector('.ab-links'):null;
  var nodes=hero?[].slice.call(hero.querySelectorAll('.ab-node')):[];
  var AMB=[],seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  for(var i=0;i<140;i++)AMB.push({x:rnd(),y:rnd(),r:0.6+rnd()*2.0,a:0.08+rnd()*0.34,tw:rnd()*6.28,ts:0.6+rnd()*1.4});
  var GM=false,mx=0,my=0,t0=0,rafId=null,heroVisible=true,lastT=0;

  /* 겹침을 사각형 측정으로 푼다 — 좌표를 믿지 않고 실측으로 해소해야
     폰트 로딩·줄바꿈·화면 폭이 바뀌어도 노드가 제목이나 캐릭터를 덮지 않는다 */
  function rel(r,base,pad){return {l:r.left-base.left-pad,t:r.top-base.top-pad,r:r.right-base.left+pad,b:r.bottom-base.top+pad};}
  function hits(a,b){return a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;}
  function layout(){
    var want=window.innerWidth>=1260&&!!lk;
    GM=want;
    if(hero)hero.classList.toggle('gm',want);
    if(!want){
      nodes.forEach(function(el){el.style.left='';el.style.top='';el.style.transform='';});
      stopLoop();return;
    }
    var heroRect=hero.getBoundingClientRect(),W=heroRect.width,H=heroRect.height;
    nodes.forEach(function(el){
      el._bx=parseFloat(el.dataset.x)/100*W;
      el._by=parseFloat(el.dataset.y)/100*H;
      el._dx=0;el._dy=0;el._tx=0;el._ty=0;
    });
    var head=hero.querySelector('.ab-head'),PAD=12;
    var heads=head?[].slice.call(head.children).map(function(k){return rel(k.getBoundingClientRect(),heroRect,PAD);}):[];
    /* 캐릭터 몸과 말풍선 자리(머리 오른쪽 위, 가장 긴 대사 폭만큼) */
    var keep=[];
    if(buddy){
      var br=rel(buddy.getBoundingClientRect(),heroRect,18);
      keep.push({l:br.l,t:br.t,r:br.r,b:br.b+46});
      if(sayEl){
        var sr=sayEl.getBoundingClientRect(),cs=getComputedStyle(sayEl);
        var sw=parseFloat(cs.maxWidth)||280,lh=parseFloat(cs.lineHeight)||21;
        var sl=sr.left-heroRect.left,st=sr.top-heroRect.top;
        keep.push({l:sl-14,t:st-14,r:sl+sw+14,b:st+lh*2+parseFloat(cs.paddingTop)*2+20});
      }
    }
    nodes.forEach(function(el){
      var w=el.offsetWidth,h=el.offsetHeight;
      function box(){return {l:el._bx-w/2,t:el._by-h/2,r:el._bx+w/2,b:el._by+h/2};}
      /* 제목 블록: 아래 또는 오른쪽으로 */
      heads.forEach(function(k){
        if(!hits(box(),k))return;
        var dDown=(k.b+h/2)-el._by,dRight=(k.r+w/2)-el._bx;
        if(dDown<=dRight)el._by=Math.min(k.b+h/2,H-h/2-84);
        else el._bx=Math.min(k.r+w/2,W-w/2-8);
      });
      /* 캐릭터·말풍선: 바깥쪽(좌우)으로 */
      keep.forEach(function(k){
        if(!hits(box(),k))return;
        if(el._bx<(k.l+k.r)/2)el._bx=Math.max(w/2+8,k.l-w/2);
        else el._bx=Math.min(W-w/2-8,k.r+w/2);
      });
      el.style.left=el._bx+'px';el.style.top=el._by+'px';
    });
    draw(lastT);
    if(!reduce)startLoop();
  }

  /* 별 배경만 그린다 — 캐릭터와 노드를 잇는 선은 두지 않는다 */
  function draw(t){
    if(!GM||!lk)return;
    var rect=hero.getBoundingClientRect(),W=rect.width,H=rect.height;
    var dpr=Math.min(2,window.devicePixelRatio||1);
    if(lk.width!==Math.round(W*dpr)||lk.height!==Math.round(H*dpr)){lk.width=Math.round(W*dpr);lk.height=Math.round(H*dpr);}
    var c=lk.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    var light=isLight();
    AMB.forEach(function(p,ai){
      var tw=0.55+0.45*Math.sin((t||0)*p.ts+p.tw),bright=(ai%11===0);
      if(bright){c.shadowBlur=8;c.shadowColor=light?'#6d4fd8':'#9fd8ff';c.fillStyle=light?'#8a6414':'#dff0ff';}
      else{c.shadowBlur=0;c.fillStyle=light?'#9aa4b2':'#8aa0c8';}
      c.globalAlpha=(bright?p.a*1.15:p.a*0.9)*tw;
      c.beginPath();c.arc(p.x*W,p.y*H,bright?p.r*1.3:p.r,0,7);c.fill();
    });
    c.shadowBlur=0;c.globalAlpha=1;
  }
  function tick(ts){
    rafId=null;
    if(!GM||!heroVisible)return;
    if(!t0)t0=ts;
    var t=(ts-t0)/1000;
    nodes.forEach(function(el,i){
      var depth=parseFloat(el.dataset.d)||1;
      var ix=Math.sin(t*0.5+i*1.7)*2.4,iy=Math.cos(t*0.42+i*1.3)*2.2;
      el._tx=mx*depth*16+ix;el._ty=my*depth*12+iy;
      el._dx=(el._dx||0)+((el._tx-(el._dx||0))*0.06);
      el._dy=(el._dy||0)+((el._ty-(el._dy||0))*0.06);
      el.style.transform='translate(calc(-50% + '+el._dx.toFixed(2)+'px), calc(-50% + '+el._dy.toFixed(2)+'px))';
    });
    lastT=t;draw(t);
    rafId=requestAnimationFrame(tick);
  }
  function startLoop(){if(rafId==null&&!reduce)rafId=requestAnimationFrame(tick);}
  function stopLoop(){if(rafId!=null){cancelAnimationFrame(rafId);rafId=null;}}

  /* 노드에 올리거나 포커스하면: 그쪽으로 고개를 갸웃 + 노드 이야기 */
  nodes.forEach(function(el){
    function enter(){
      el._hot=1;
      if(buddy){
        var nr=el.getBoundingClientRect(),br=buddy.getBoundingClientRect();
        B.look=((nr.left+nr.width/2)<(br.left+br.width/2)?-1:1)*5;
        B.vel+=B.look*6;B.liftV-=40;
      }
      if(el.dataset.say)speak(el.dataset.say,6500);
    }
    function leave(){el._hot=0;B.look=0;}
    el.addEventListener('mouseenter',enter);el.addEventListener('focus',enter);
    el.addEventListener('mouseleave',leave);el.addEventListener('blur',leave);
  });

  if(hero){
    hero.addEventListener('mousemove',function(e){
      var r=hero.getBoundingClientRect();
      mx=(e.clientX-r.left)/r.width-0.5;my=(e.clientY-r.top)/r.height-0.5;
      B.lean=mx;
    });
    hero.addEventListener('mouseleave',function(){mx=0;my=0;B.lean=0;});
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){
        es.forEach(function(en){heroVisible=en.isIntersecting;});
        B.vis=heroVisible;
        if(heroVisible){bStart();if(GM)startLoop();}else stopLoop();
      }).observe(hero);
    }
  }
  if(hero&&lk){
    var rt=null,relayout=function(){clearTimeout(rt);rt=setTimeout(layout,150);};
    window.addEventListener('resize',relayout);
    layout();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
    /* 히어로 폭이나 헤드 블록 크기가 나중에 바뀌면(스크롤바 등장·지연 폰트 적용)
       노드 좌표와 실측 위치가 어긋난 채 남는다 — 크기 변화를 관찰해 다시 배치한다 */
    if('ResizeObserver' in window){
      var lastSize='',headEl=hero.querySelector('.ab-head');
      var ro=new ResizeObserver(function(){
        var hr=hero.getBoundingClientRect(),kr=headEl?headEl.getBoundingClientRect():null;
        var key=Math.round(hr.width)+'x'+Math.round(hr.height)+
                (kr?'|'+Math.round(kr.width)+'x'+Math.round(kr.height):'');
        if(key===lastSize)return;
        lastSize=key;relayout();
      });
      ro.observe(hero);
      if(headEl)ro.observe(headEl);
    }
    window.addEventListener('load',relayout);
  }

  /* ---------- 테마 전환 시 별 배경 다시 그림 ---------- */
  if('MutationObserver' in window){
    new MutationObserver(function(){draw(lastT);})
      .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }

  /* ---------- 숫자 카운트업 ---------- */
  var stats=app.querySelector('.ab-stats');
  if(stats&&!reduce&&'IntersectionObserver' in window){
    var counted=false;
    var io2=new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(!en.isIntersecting||counted)return;
        counted=true;io2.disconnect();
        [].slice.call(stats.querySelectorAll('.n')).forEach(function(el){
          var node=el.firstChild;if(!node||node.nodeType!==3)return;
          var target=parseInt(node.nodeValue,10);if(!target)return;
          var s0=null;
          function st(ts){
            if(!s0)s0=ts;
            var p=Math.min(1,(ts-s0)/900);p=1-Math.pow(1-p,3);
            node.nodeValue=String(Math.round(target*p));
            if(p<1)requestAnimationFrame(st);
          }
          requestAnimationFrame(st);
        });
      });
    },{threshold:.35});
    io2.observe(stats);
  }

  /* ---------- 스크롤 리빌 ---------- */
  if(!reduce&&'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
    },{rootMargin:'0px 0px -8% 0px'});
    [].slice.call(app.querySelectorAll('.ab-sec, .ab-stats')).forEach(function(el){
      el.classList.add('rv');io.observe(el);
    });
  }
})();
</script>
